name: dlm_platform
description: "OS integration behind interfaces: window chrome, tray, notifications, daemon supervisor."
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
dependencies:
  dbus: any
  desktop_drop: ^0.8.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_secure_storage: ^11.2.0
  hotkey_manager: ^0.2.3
  screen_retriever: any
  tray_manager: ^0.8.0
  win32_registry: ^3.0.3
  window_manager: ^0.5.2
  xdg_desktop_portal: ^0.1.15
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      macos:
        pluginClass: DlmPlatformPlugin
