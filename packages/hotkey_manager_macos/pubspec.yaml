name: hotkey_manager_macos
description: "macOS side of hotkey_manager as a Swift Package Manager plugin with no CocoaPods dependency (the published 0.2.0 needs CocoaPods and the HotKey pod). Same channel protocol."
version: 0.2.0+dlm.1
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  hotkey_manager_platform_interface: ^0.2.0
flutter:
  plugin:
    implements: hotkey_manager
    platforms:
      macos:
        pluginClass: HotkeyManagerMacosPlugin
