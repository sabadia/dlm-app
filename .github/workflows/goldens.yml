name: Update goldens

# Golden images must be produced on the same pinned image CI compares them on.
# Run this from the Actions tab on your branch; it commits the new images to it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - name: Regenerate
        run: dart run dlm_tools:test_all --allow-empty --tags golden --update-goldens
      - name: Commit the images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "goldens are up to date"
          else
            git commit -m "test: update golden images"
            git push
          fi
