name: Nightly contract

# Runs the app's own end-to-end tests against the newest dlm release, and
# compares its OpenAPI document with the one the app was generated from. A red
# run means a daemon release changed something the app relies on: fix the app
# or pin the older daemon before users get the newer one.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: newest release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev libsecret-1-dev libayatana-appindicator3-dev libkeybinder-3.0-dev
      - name: Fetch the newest daemon (checksum verified)
        id: daemon
        shell: bash
        run: |
          bin="$(bash tools/fetch_daemon.sh latest "$RUNNER_TEMP/dlm")"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Compare the API with the pinned one
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tag="$(gh release view -R sabadia/dlm-server --json tagName -q .tagName)"
          gh release download "$tag" -R sabadia/dlm-server -p "dlm_${tag#v}_openapi-3.0.json" -D "$RUNNER_TEMP" --clobber
          dart run dlm_tools:check_contract packages/dlm_api/spec/openapi-3.0.json "$RUNNER_TEMP/dlm_${tag#v}_openapi-3.0.json"
      - name: End-to-end tests against the newest daemon
        shell: bash
        working-directory: apps/dlm_app
        env:
          DLM_DAEMON: ${{ steps.daemon.outputs.bin }}
        run: flutter test test_e2e --tags e2e
